version: "3.9"

services:
  devopsdb:
    image: jagadishkumpati/firstrepo:dbimage
    ports:
      - "3306:3306"
    deploy:
      replicas: 3
    networks:
      - mynet

  application:
    image: jagadishkumpati/firstrepo:appimage
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynet

networks:
  mynet:
    driver: overlay

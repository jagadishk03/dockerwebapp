version: "3.9"

services:
  devopsdb:
    image: jagadishkumpati/firstrepo:dbimage
    ports:
      - "3306:3306"
    deploy:
      replicas: 3
    
    

  application:
    image: jagadishkumpati/firstrepo:appimage
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    
